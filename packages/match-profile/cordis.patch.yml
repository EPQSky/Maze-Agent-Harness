- insert:
    - id: maze-match-protocol-generator
      name: '@maze-arena/match-profile/host'
      inject: [mazeGenerator]
      disabled: !!js process.env.MAZE_MATCH_ROLE !== 'generator'
    - id: maze-match-protocol-solver
      name: '@maze-arena/match-profile/host'
      inject: [mazeSolver]
      disabled: !!js process.env.MAZE_MATCH_ROLE !== 'solver'
